<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPC CODES INTERNATIONAL</title>
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <div class="backdrop-orb orb-one"></div>
    <div class="backdrop-orb orb-two"></div>
    <div class="grid-overlay"></div>

    <main class="container">
        <section class="panel">
            <p class="eyebrow">Creative digital solutions</p>

            <h1 class="brand" aria-label="KPC CODES INTERNATIONAL">
                <span class="word word-top">KPC CODES</span>
                <span class="word word-bottom">INTERNATIONAL</span>
            </h1>

            <p class="tagline">
                Building bold digital experiences with motion, technology, and precision.
            </p>

            <div class="spinner-frame" aria-hidden="true">
                <div id="spinner"></div>
            </div>

            <div class="cta-row">
                <button type="button" class="primary" onclick="changeMode()">
                    Change Motion
                </button>
                <button type="button" class="secondary" onclick="toggleGlow()">
                    Toggle Glow
                </button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
